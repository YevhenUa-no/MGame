<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera & Control Testing</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.5;
        }
        kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>Controls:</strong><br>
        <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> - Move<br>
        <kbd>Space</kbd> - Jump<br>
        <kbd>Shift</kbd> - Run<br>
        <br>
        <strong>Camera:</strong><br>
        Click & Drag to rotate camera (Yaw).<br>
        Use the top-right menu to tune camera parameters!
    </div>

    <script type="module">
        import { createCore } from './src/lib/engine/core.js';
        import { createPlayer, updatePlayer, PHYSICS_CONFIG } from './src/lib/engine/player.js';
        import { createInputController } from './src/lib/engine/inputController.js';
        import { createCameraRig } from './src/lib/engine/cameraRig.js';
        
        import * as THREE from 'three';
        import GUI from 'https://esm.sh/lil-gui';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

        const FIXED_TIMESTEP = 1 / 60;
        const MAX_SUBSTEPS = 5;

        // --- GRID TEXTURE GENERATION ---
        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            const rows = 8;
            const cols = 8;
            const w = canvas.width / cols;
            const h = canvas.height / rows;
            
            ctx.font = 'bold 40px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#888' : '#666';
                    ctx.fillRect(c * w, r * h, w, h);
                    
                    ctx.fillStyle = '#444';
                    const text = r % 2 === 0 ? c.toString() : letters[c % letters.length];
                    ctx.fillText(text, c * w + w/2, r * h + h/2);
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 10);
            return texture;
        }

        // --- CUSTOM TEST WORLD ---
        function buildTestWorld(scene) {
            const collidableGeometries = [];
            const gridMat = new THREE.MeshStandardMaterial({ 
                map: createGridTexture(),
                roughness: 0.8
            });
            
            // Helper to add geometry to visual scene and collision array
            function addShape(geo) {
                collidableGeometries.push(geo);
                const mesh = new THREE.Mesh(geo, gridMat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            }

            // Floor
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            floorGeo.rotateX(-Math.PI / 2);
            
            // Adjust UVs for the massive floor so the grid is sized nicely
            const uvs = floorGeo.attributes.uv.array;
            for (let i = 0; i < uvs.length; i++) {
                uvs[i] *= 10; 
            }
            addShape(floorGeo);
            
            // Stairs
            for(let i = 0; i < 8; i++) {
                const step = new THREE.BoxGeometry(4, 0.4, 1);
                step.translate(4, 0.2 + i * 0.4, -5 - i * 1);
                addShape(step);
            }
            
            // Ramp
            const ramp = new THREE.BoxGeometry(4, 0.5, 8);
            ramp.rotateX(-Math.PI / 10);
            ramp.translate(-4, 1.2, -8);
            addShape(ramp);

            // Platform at the top of ramp/stairs
            const platform = new THREE.BoxGeometry(12, 3.2, 4);
            platform.translate(0, 1.6, -13);
            addShape(platform);

            // Floating obstacle (tests camera occlusion/jumping)
            const floating = new THREE.BoxGeometry(4, 1, 4);
            floating.translate(0, 5, -5);
            addShape(floating);

            // Merge everything into one BVH collider
            const merged = mergeGeometries(collidableGeometries, false);
            merged.computeBoundsTree();
            
            const collider = new THREE.Mesh(merged, new THREE.MeshBasicMaterial({ visible: false }));
            scene.add(collider);
            
            return { collider };
        }

        // 1. ENGINE SETUP
        const canvas = document.createElement('canvas');
        document.body.insertBefore(canvas, document.body.firstChild);
        
        const { scene, camera, renderer, clock } = createCore(canvas);

        // Basic lighting for the test scene
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        const { collider } = buildTestWorld(scene);
        const player = createPlayer(scene);

        // --- CUSTOM DUMMY CHARACTER (Hiding the default player mesh) ---
        // The user screenshot showed a specific placeholder dummy shape
        player.mesh.children.forEach(c => c.visible = false); // hide existing torso/head
        
        const dummyGroup = new THREE.Group();
        // Body sphere
        const bodyGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const bodyMat = new THREE.MeshNormalMaterial(); // Gives that colorful rainbow shading
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = 0.35;
        dummyGroup.add(bodyMesh);
        // Head sphere
        const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const headMesh = new THREE.Mesh(headGeo, bodyMat);
        headMesh.position.y = 0.7;
        dummyGroup.add(headMesh);
        // Beak/Nose
        const beakGeo = new THREE.ConeGeometry(0.08, 0.25, 8);
        const beakMesh = new THREE.Mesh(beakGeo, bodyMat);
        beakMesh.rotation.x = Math.PI / 2;
        beakMesh.position.set(0, 0.7, 0.25);
        dummyGroup.add(beakMesh);
        
        player.mesh.add(dummyGroup);

        const input = createInputController();
        const cameraRig = createCameraRig(camera, canvas);

        // 2. GUI SETUP (lil-gui)
        const gui = new GUI({ title: 'Camera Settings' });
        
        const camFolder = gui.addFolder('Camera Rig');
        camFolder.add(cameraRig.state, 'distance', 1, 15, 0.1).name('Distance Behind');
        camFolder.add(cameraRig.state, 'height', 0.5, 10, 0.1).name('Height Offset');
        camFolder.add(cameraRig.state, 'pitch', -1.5, 1.5, 0.01).name('Pitch (Tilt)');
        
        const feelFolder = gui.addFolder('Movement Feel');
        feelFolder.add(cameraRig.state, 'followLerp', 0.5, 15, 0.1).name('Follow Snappiness');
        feelFolder.add(cameraRig.state, 'lookLerp', 0.5, 15, 0.1).name('Look Snappiness');
        
        const physFolder = gui.addFolder('Physics');
        physFolder.add(PHYSICS_CONFIG, 'gravity', -60, -5, 1).name('Gravity');
        physFolder.add(PHYSICS_CONFIG, 'jumpSpeed', 2, 25, 0.5).name('Jump Strength');
        physFolder.add(PHYSICS_CONFIG, 'walkSpeed', 1, 15, 0.1).name('Walk Speed');
        physFolder.add(PHYSICS_CONFIG, 'runSpeed', 2, 25, 0.1).name('Run Speed');
        physFolder.add(PHYSICS_CONFIG, 'moveAccel', 10, 100, 1).name('Acceleration');
        physFolder.add(PHYSICS_CONFIG, 'moveDamping', 1, 30, 0.5).name('Friction / Damping');
        
        const systemParams = { targetFPS: 60 };
        gui.add(systemParams, 'targetFPS', 10, 144, 1).name('Simulated FPS');

        const defaultState = {
            distance: 6.5,
            height: 3.2,
            pitch: -0.42,
            followLerp: 3.2,
            lookLerp: 5
        };
            // --- VISUAL PHYSICS ARROWS ---
            // Create arrow helpers to match the user's diagram
            const gravityArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 0, 0), 1, 0xaacc00, 0.2, 0.2);
            const jumpArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 0, 0xaacc00, 0.2, 0.2);
            const displaceArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 0, 0xaacc00, 0.2, 0.2);
            
            // Add arrows to the dummy group so they move with the player
            dummyGroup.add(gravityArrow);
            dummyGroup.add(jumpArrow);
            dummyGroup.add(displaceArrow);

            // 3. GAME LOOP
            let animationHandle = null;
            let accumulator = 0;
            let lastTime = performance.now();

            function tick() {
                animationHandle = requestAnimationFrame(tick);

                // FPS Throttling for testing physics robustness
                const now = performance.now();
                const elapsed = now - lastTime;
                const interval = 1000 / systemParams.targetFPS;
                if (elapsed < interval && systemParams.targetFPS < 144) return;
                lastTime = now - (elapsed % interval);

                const frameDelta = Math.min(clock.getDelta(), 0.25);
                accumulator += frameDelta;

                let steps = 0;
                while (accumulator >= FIXED_TIMESTEP && steps < MAX_SUBSTEPS) {
                    updatePlayer(player, collider, input.state, cameraRig.yaw, FIXED_TIMESTEP);
                    accumulator -= FIXED_TIMESTEP;
                    steps += 1;
                }

                // Optional: slight bobbing animation on the dummy mesh to visualize movement
                const horizontalSpeed = Math.hypot(player.velocity.x, player.velocity.z);
                if (horizontalSpeed > 0.1 && player.isGrounded) {
                    dummyGroup.position.y = Math.abs(Math.sin(performance.now() * 0.015)) * 0.1;
                    dummyGroup.rotation.z = Math.sin(performance.now() * 0.01) * 0.05;
                } else {
                    dummyGroup.position.y = 0;
                    dummyGroup.rotation.z = 0;
                }

                // --- UPDATE ARROWS ---
                // Gravity is constant downward force
                gravityArrow.setLength(1.5, 0.3, 0.3);
                
                // Jump arrow shows up when velocity.y is positive
                if (player.velocity.y > 0) {
                    jumpArrow.setLength(player.velocity.y * 0.3, 0.3, 0.3);
                    jumpArrow.visible = true;
                } else {
                    jumpArrow.visible = false;
                }

                // Displacement arrow shows horizontal velocity
                if (horizontalSpeed > 0.1) {
                    // Calculate direction in local space of the dummy mesh
                    const moveDir = new THREE.Vector3(player.velocity.x, 0, player.velocity.z).normalize();
                    // Convert world direction to local direction so the arrow points correctly
                    const localDir = moveDir.clone().applyQuaternion(dummyGroup.parent.quaternion.clone().invert());
                    displaceArrow.setDirection(localDir);
                    displaceArrow.setLength(horizontalSpeed * 0.4, 0.3, 0.3);
                    displaceArrow.visible = true;
                } else {
                    displaceArrow.visible = false;
                }

                cameraRig.update(player.mesh, frameDelta);
                renderer.render(scene, camera);
            }

        clock.start();
        tick();

    </script>
</body>
</html>
